# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties:
      steelLocal:
        type: boolean
        description: Set to true to drive a self-hosted steel-browser instead of Steel Cloud.
      steelApiKey:
        type: string
        description: Steel Cloud API key. Required unless steelLocal is true.
      steelBaseUrl:
        type: string
        description: Base URL for the Steel API. Defaults to https://api.steel.dev, or
          http://localhost:3000 when steelLocal is true.
      steelProfile:
        type: string
        enum: [scrape, browse]
        description: Which tool preset to expose. Defaults to browse; scrape exposes only the
          three stateless read tools, which start no billed browser session.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({command:'node',args:['dist/stdio.js'],env:{STEEL_LOCAL:config.steelLocal?.toString(),STEEL_API_KEY:config.steelApiKey,STEEL_BASE_URL:config.steelBaseUrl,STEEL_PROFILE:config.steelProfile}})
