name: Release

# Tags are the trigger, so cutting a release is `npm version` + `git push --follow-tags` and nothing
# else. The tag is checked against package.json before anything is built or published, because a tag
# is the one thing here that cannot be corrected after the fact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Only the container publish needs this, and only when it is switched on.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: The tag names the version package.json ships
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $packaged." >&2
            echo "Run 'npm version' rather than tagging by hand: it bumps every file that states" >&2
            echo "the version and tags the resulting commit." >&2
            exit 1
          fi
          echo "Releasing $packaged"

      - run: npm install

      - name: Every file that states the version agrees
        run: npm run sync:version -- --check

      # The same gates ci.yml runs. A tag is not a reason to skip any of them.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run budget
      - run: ./scripts/run-conformance.sh

      - name: Pack the MCPB bundle
        run: npm run pack:mcpb

      # Attaching the bundle is the point: without it the only way to get the file is to clone the
      # repository and build it, which is not something a Claude Desktop user is going to do.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            build/steel-mcp-*.mcpb

      # Both publishes stay off until the credentials exist and someone decides to turn them on.
      # Set the repository variable PUBLISH_NPM or PUBLISH_DOCKER to 'true' to enable one.
      - name: Publish to npm
        if: vars.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish the container image
        if: vars.PUBLISH_DOCKER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
