name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Real-browser E2E tests
        run: npm run test:e2e
      - name: tools/list byte budget
        run: npm run budget
      - name: MCP conformance
        run: ./scripts/run-conformance.sh
      - name: MCPB bundle
        run: npm run pack:mcpb
      # Nothing else builds this Dockerfile — the E2E stack runs upstream images — so without this the
      # image is first built during a release. Running both entrypoints is the point rather than the
      # build: three separate faults got through a green build here, each of them silent. The image
      # reinstalled devDependencies and grew 280MB; a fix for that left the hosted server unable to
      # resolve ioredis; and the documented way to select the hosted entrypoint ran the stdio one.
      - name: Container image serves both entrypoints
        run: |
          docker build -t steel-mcp:ci .

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm -e STEEL_API_KEY=ci-not-a-real-key steel-mcp:ci 2>/dev/null \
            | grep -q '"steel_scrape"'
          echo 'stdio entrypoint lists its tools'

          # OTEL_* asks for tracing the image deliberately cannot provide, so this also checks that a
          # missing exporter stack is warned about rather than fatal.
          docker run -d --rm --name steel-mcp-ci -p 18080:8080 \
            -e STEEL_ALLOWED_HOSTS=localhost \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318 \
            steel-mcp:ci dist/hosted.js
          for _ in $(seq 1 30); do
            curl -sf http://localhost:18080/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:18080/healthz > /dev/null
          echo 'hosted entrypoint answers /healthz'
          docker logs steel-mcp-ci 2>&1 | grep -q 'Tracing was requested but could not start'
          echo 'a missing exporter stack is a warning, not a crash'
          docker rm -f steel-mcp-ci > /dev/null
